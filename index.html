<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF‑8" />
  <title>Blink Detection (TensorFlow.js)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.16.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.3/dist/face-landmarks-detection.min.js"></script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    video, canvas { position: absolute; transform: scaleX(-1); }
    #counter { position: absolute; color: #0f0; font: 20px sans-serif; top: 10px; left: 10px; }
  </style>
</head>
<body>
  <video id="video" width="640" height="480" autoplay muted playsinline></video>
  <canvas id="canvas" width="640" height="480"></canvas>
  <div id="counter">Blinks: 0</div>
  <script>
      let model, video, canvas, ctx;
let blinkCount = 0, blinked = false;

async function setupCamera() {
  video = document.getElementById('video');
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  return new Promise(res => video.onloadedmetadata = res);
}

function getYdist(upper, lower) {
  return Math.abs(lower[1] - upper[1]);
}

function drawLandmarks(mesh) {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#0f0';
  mesh.forEach(pt => ctx.fillRect(pt[0]-1, pt[1]-1, 2, 2));
}

async function detectLoop() {
  const faces = await model.estimateFaces({ input: video, flipHorizontal: true, predictIrises: true });
  if (faces.length > 0) {
    const ann = faces[0].annotations;
    const upperL = ann.leftEyeUpper0[4], lowerL = ann.leftEyeLower0[5];
    const upperR = ann.rightEyeUpper0[4], lowerR = ann.rightEyeLower0[5];
    const opL = getYdist(upperL, lowerL), opR = getYdist(upperR, lowerR);
    const avg = (opL + opR) / 2;
    drawLandmarks(faces[0].scaledMesh);

    const closeTh = 5, openTh = 7;
    if (!blinked && avg < closeTh) blinked = true;
    if (blinked && avg > openTh) {
      blinkCount++;
      document.getElementById('counter').innerText = `Blinks: ${blinkCount}`;
      blinked = false;
    }
  }
  requestAnimationFrame(detectLoop);
}

async function main() {
  await tf.setBackend('webgl');
  await setupCamera();

  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  model = await faceLandmarksDetection.load(
    faceLandmarksDetection.SupportedPackages.mediapipeFacemesh,
    { shouldLoadIrisModel: true, maxFaces: 1 }
  );

  detectLoop();
}

main();

  </script>
</body>
</html>
